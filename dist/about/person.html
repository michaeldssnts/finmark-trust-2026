<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our team — FinMark Trust</title>
<meta name="description" content="FinMark Trust team member profile and the research they have written.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23213265'/%3E%3Cpath d='M15 14h18v8H23v8h9v8h-9v13h-8V14Zm22 0h12v37h-8V23h-4v-9Z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../styles.css">
<style>
  .pf-hero{position:relative;overflow:hidden;background:var(--navy-deep);color:#fff;padding:46px 0 0}
  .pf-hero:after{content:"";position:absolute;right:9%;bottom:-160px;width:36px;height:380px;background:var(--teal);transform:rotate(45deg);opacity:.85}
  .pf-hero .container{position:relative;z-index:1}
  .pf-hero .breadcrumbs a:hover{color:#fff}
  .pf-head{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:end}
  .pf-photo{width:230px;height:270px;margin-bottom:-60px;background:#dfe6e9;border:6px solid #fff;box-shadow:var(--shadow);overflow:hidden;display:grid;place-items:center;color:var(--navy);font-size:3rem;font-weight:800}
  .pf-photo img{width:100%;height:100%;object-fit:cover;object-position:center top}
  .pf-name{padding-bottom:40px}
  .pf-name .eyebrow{margin-bottom:12px}
  .pf-name h1{margin:0 0 8px;font-size:clamp(2.1rem,4.4vw,3.6rem);line-height:1.05;letter-spacing:-.03em}
  .pf-role{margin:0;color:#8ce3ed;font-weight:700;font-size:1.05rem}
  .pf-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .pf-links a{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border:1px solid rgba(255,255,255,.35);border-radius:999px;font-size:.84rem;font-weight:700}
  .pf-links a:hover{background:rgba(255,255,255,.1);border-color:#fff}
  .pf-body{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;padding:96px 0 40px}
  .pf-stats{list-style:none;margin:0;padding:0;display:grid;gap:14px;align-content:start}
  .pf-stats li{padding:16px 18px;border:1px solid var(--border);border-top:3px solid var(--teal)}
  .pf-stats b{display:block;color:var(--navy);font-size:1.7rem;line-height:1}
  .pf-stats span{color:var(--muted);font-size:.8rem}
  .pf-bio{max-width:820px;font-size:1.08rem;line-height:1.8;color:#2d3852}
  .pf-bio p{margin:0 0 1.1em}
  .pf-bio .none{color:var(--muted)}
  .pf-work{background:#f5f8fa;border-top:1px solid var(--border);padding:64px 0 80px}
  .pf-work-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}
  .pf-work-head h2{margin:0;color:var(--navy);font-size:clamp(1.6rem,2.6vw,2.2rem)}
  .pf-work-head a{color:var(--teal);font-weight:700;font-size:.88rem}
  .pf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .pf-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--border);border-top:4px solid var(--tc,var(--teal));transition:transform .2s,box-shadow .2s}
  .pf-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .pf-card .im{aspect-ratio:2114/744;overflow:hidden;background:var(--navy);display:grid;place-items:center}
  .pf-card .im img{width:100%;height:100%;object-fit:cover}
  .pf-card .im b{color:#fff;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase}
  .pf-card .bd{display:flex;flex-direction:column;gap:8px;padding:16px 20px 20px;flex:1}
  .pf-card small{color:var(--muted);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .pf-card strong{color:var(--navy);line-height:1.35}
  .pf-card .tg{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--tc,var(--teal)) 12%,#fff);color:color-mix(in srgb,var(--tc,var(--teal)) 58%,#0b1430);font-size:.7rem;font-weight:700}
  .pf-card .tg:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc,var(--teal))}
  .pf-empty{padding:28px;background:#fff;border:1px dashed var(--border);color:var(--muted)}
  .pf-back{padding:30px 0 0}.pf-back a{color:var(--teal);font-weight:700;font-size:.9rem}
  @media(max-width:980px){.pf-grid{grid-template-columns:1fr 1fr}.pf-body{grid-template-columns:1fr;padding-top:90px}.pf-stats{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){.pf-head{grid-template-columns:1fr;gap:20px}.pf-photo{width:160px;height:190px;margin-bottom:0}.pf-name{padding-bottom:30px}.pf-body{padding-top:40px}.pf-grid{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){.pf-card{transition:none}}
</style>
</head>
<body data-page="about">
<div id="site-header"></div>
<main id="main"><div class="container" style="padding:120px 0;color:var(--muted)">Loading…</div></main>
<div id="site-footer"></div>
<script>
(function () {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const asset = p => (p && p.startsWith('/uploads/') ? '..' + p : p);
  const fmt = d => (d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '');
  const id = new URLSearchParams(location.search).get('id');
  const main = document.getElementById('main');
  const fail = msg => { main.innerHTML = `<section class="container" style="padding:110px 0"><p class="eyebrow">Our team</p><h1 style="color:var(--navy);margin:0 0 24px">${esc(msg)}</h1><a class="primary-btn" href="index.html#team">Meet the team</a></section>`; };
  fetch('../knowledge-hub/knowledge.json').then(r => r.json()).then(feed => {
    const p = (feed.people || []).find(x => x.slug === id);
    if (!p) return fail('We couldn’t find that person.');
    document.title = `${p.name} — FinMark Trust`;
    const TH = Object.fromEntries((feed.themes || []).map(t => [t.slug, t]));
    const work = (feed.items || []).filter(i => (i.au || []).includes(p.slug));
    const types = [...new Set(work.map(i => i.y))];
    const first = p.name.replace(/^(Dr|Prof)\.?\s+/, '').split(' ')[0];
    const initials = p.name.replace(/^(Dr|Prof)\.?\s+/, '').split(/\s+/).map(w => w[0]).slice(0, 2).join('');
    const card = i => {
      const t = (i.th || []).map(s => TH[s]).find(Boolean);
      const href = i.p ? `../knowledge-hub/post.html?id=${encodeURIComponent(i.id)}` : asset(i.u) || '../knowledge-hub/index.html';
      const ext = !i.p && (/^https?:/.test(href) || /\.pdf$/i.test(href));
      return `<a class="pf-card" href="${esc(href)}"${t ? ` style="--tc:${t.colour}"` : ''}${ext ? ' target="_blank" rel="noopener"' : ''}>
        <span class="im">${i.img ? `<img src="${esc(asset(i.img))}" alt="" loading="lazy">` : `<b>${esc(i.y)}</b>`}</span>
        <span class="bd"><small>${esc(i.y)} · ${fmt(i.d)}</small><strong>${esc(i.t)}</strong>${t ? `<span class="tg">${esc(t.name)}</span>` : ''}</span></a>`;
    };
    main.innerHTML = `
      <header class="pf-hero"><div class="container">
        <div class="breadcrumbs"><a href="../index.html">Home</a><span>/</span><a href="index.html">About</a><span>/</span><a href="index.html#${p.group === 'trustee' ? 'trustees' : 'team'}">${p.group === 'trustee' ? 'Our trustees' : 'Our team'}</a></div>
        <div class="pf-head">
          <div class="pf-photo">${p.photo ? `<img src="${esc(asset(p.photo))}" alt="${esc(p.name)}" onerror="this.replaceWith(document.createTextNode('${esc(initials)}'))">` : esc(initials)}</div>
          <div class="pf-name"><p class="eyebrow light">${p.group === 'trustee' ? 'Trustee' : 'FinMark Trust team'}</p><h1>${esc(p.name)}</h1><p class="pf-role">${esc(p.role)}</p>
            ${p.email || p.linkedin ? `<div class="pf-links">${p.email ? `<a href="mailto:${esc(p.email)}">Email ${esc(first)}</a>` : ''}${p.linkedin ? `<a href="${esc(p.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>` : ''}</div>` : ''}</div>
        </div>
      </div></header>
      <section class="container pf-body">
        <ul class="pf-stats" aria-label="At a glance"><li><b>${work.length}</b><span>Knowledge Hub piece${work.length === 1 ? '' : 's'}</span></li>${work.length ? `<li><b>${types.length}</b><span>${esc(types.join(', '))}</span></li>` : ''}</ul>
        <div class="pf-bio">${p.bio ? '<p>' + esc(p.bio).replace(/\n\n/g, '</p><p>') + '</p>' : '<p class="none">Biography coming soon.</p>'}</div>
      </section>
      <section class="pf-work" aria-labelledby="pfWork"><div class="container">
        <div class="pf-work-head"><h2 id="pfWork">Written by ${esc(first)}</h2><a href="../knowledge-hub/index.html">Browse the Knowledge Hub →</a></div>
        ${work.length ? `<div class="pf-grid">${work.map(card).join('')}</div>` : `<p class="pf-empty">No Knowledge Hub pieces by ${esc(first)} yet.</p>`}
        <div class="pf-back"><a href="index.html#${p.group === 'trustee' ? 'trustees' : 'team'}">← Back to the team</a></div>
      </div></section>`;
  }).catch(() => fail('Sorry, this profile couldn’t load.'));
})();
</script>
<script src="../site.js"></script>
</body>
</html>
