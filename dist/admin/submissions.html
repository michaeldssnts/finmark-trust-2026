<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Submissions — FinMark Trust</title>
<style>
  :root{--navy:#213265;--teal:#0098ae;--ink:#17213b;--muted:#5a6680;--line:#dbe2e8;--bg:#f3f6f8;--warn:#9a6200;--bad:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Open Sans",Arial,Helvetica,sans-serif}
  header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header h1{font-size:1.1rem;margin:0}
  header a{color:#fff}
  main{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .tabs button,.btn{border:1px solid var(--line);background:#fff;color:var(--navy);font:inherit;font-weight:600;padding:8px 14px;border-radius:3px;cursor:pointer}
  .tabs button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  input[type=search]{flex:1;min-width:220px;border:1px solid var(--line);border-radius:3px;padding:8px 12px;font:inherit}
  .note{background:#fff4dc;color:var(--warn);border:1px solid #f0d9a6;padding:10px 14px;border-radius:3px;margin-bottom:14px}
  .wrap{overflow-x:auto;background:#fff;border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:.86rem}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#eef3f6;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
  td.msg{max-width:420px;white-space:pre-wrap}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:#e5f6f8;color:#00697a}
  .tag.no{background:#fde7e6;color:var(--bad)}
  .del{color:var(--bad);border-color:#f1c8c5}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .count{color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<header><h1>Website submissions</h1><span id="who"></span><a href="./">← Back to the content manager</a></header>
<main>
  <div id="msg"></div>
  <div class="bar">
    <div class="tabs" role="group" aria-label="Form"><button type="button" data-t="dataset" aria-pressed="true">Dataset downloads</button> <button type="button" data-t="contact" aria-pressed="false">Contact us</button></div>
    <input type="search" id="q" placeholder="Search name, email, organisation, country…" aria-label="Search submissions">
    <span class="count" id="count"></span>
    <button type="button" class="btn primary" id="csv">Download CSV</button>
  </div>
  <div class="wrap"><table><thead id="head"></thead><tbody id="rows"><tr><td class="empty">Loading…</td></tr></tbody></table></div>
  <p class="count">These records are personal information (POPIA). Keep the CSV safe, and delete a person's record if they ask. Only people who can edit the website in GitHub can see this page.</p>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var token = null;
  ['decap-cms-user', 'netlify-cms-user'].forEach(function (k) { try { var u = JSON.parse(localStorage.getItem(k) || 'null'); if (u && u.token && !token) token = u.token; } catch (e) {} });
  var ROWS = [], T = 'dataset';
  var COLS = {
    dataset: [['at', 'Date'], ['first', 'First name'], ['last', 'Surname'], ['email', 'Email'], ['organisation', 'Organisation'], ['orgType', 'Type'], ['country', 'Country'], ['year', 'Year'], ['survey', 'Survey'], ['use', 'How they will use it'], ['emailed', 'Link sent']],
    contact: [['at', 'Date'], ['name', 'Name'], ['email', 'Email'], ['organisation', 'Organisation'], ['topic', 'Topic'], ['message', 'Message'], ['emailed', 'Alert sent']]
  };
  var fmt = function (k, v) { if (k === 'at') return new Date(v).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); if (k === 'emailed') return v ? 'Yes' : 'No'; return v; };
  function api(path, method) {
    return fetch('/api/admin/' + path, { method: method || 'GET', headers: { Authorization: 'Bearer ' + token } }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); });
  }
  function list() {
    var q = $('q').value.trim().toLowerCase();
    return ROWS.filter(function (r) { return r.type === T && (!q || JSON.stringify(r).toLowerCase().indexOf(q) > -1); });
  }
  function render() {
    var cols = COLS[T], rows = list();
    $('head').innerHTML = '<tr>' + cols.map(function (c) { return '<th>' + c[1] + '</th>'; }).join('') + '<th></th></tr>';
    $('count').textContent = rows.length + ' record' + (rows.length === 1 ? '' : 's');
    $('rows').innerHTML = rows.length ? rows.map(function (r) {
      return '<tr>' + cols.map(function (c) {
        var v = fmt(c[0], r[c[0]]);
        if (c[0] === 'emailed') return '<td><span class="tag' + (r.emailed ? '' : ' no') + '" title="' + esc(r.emailError || '') + '">' + v + '</span>' + (!r.emailed && T === 'dataset' ? ' <button class="btn" data-resend="' + r.id + '">Send again</button>' : '') + '</td>';
        if (c[0] === 'email') return '<td><a href="mailto:' + esc(v) + '">' + esc(v) + '</a></td>';
        return '<td' + (c[0] === 'message' || c[0] === 'use' ? ' class="msg"' : '') + '>' + esc(v) + '</td>';
      }).join('') + '<td><button class="btn del" data-del="' + r.id + '">Delete</button></td></tr>';
    }).join('') : '<tr><td class="empty" colspan="' + (cols.length + 1) + '">No submissions yet.</td></tr>';
  }
  function load() {
    if (!token) { $('rows').innerHTML = '<tr><td class="empty">Sign in to the <a href="./">content manager</a> first, then come back to this page.</td></tr>'; return; }
    api('submissions').then(function (j) {
      ROWS = j.rows; $('who').textContent = 'Signed in as ' + j.user;
      if (!j.mail) $('msg').innerHTML = '<div class="note"><b>Email is not set up yet.</b> Submissions are saved, but no emails go out until the Microsoft 365 step in the guide is done (sudo finmark email-setup).</div>';
      render();
    }).catch(function (e) { $('rows').innerHTML = '<tr><td class="empty">' + esc(e.message) + ' <a href="./">Open the content manager</a> and sign in again.</td></tr>'; });
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-t]');
    if (t) { T = t.dataset.t; document.querySelectorAll('[data-t]').forEach(function (b) { b.setAttribute('aria-pressed', b === t); }); return render(); }
    var d = e.target.closest('[data-del]');
    if (d) {
      if (d.dataset.sure !== '1') { d.dataset.sure = '1'; d.textContent = 'Click again to delete'; return; }
      api('submissions/' + d.dataset.del, 'DELETE').then(function () { ROWS = ROWS.filter(function (r) { return r.id !== d.dataset.del; }); render(); }).catch(function (er) { alert(er.message); });
      return;
    }
    var s = e.target.closest('[data-resend]');
    if (s) { s.disabled = true; s.textContent = 'Sending…'; api('submissions/' + s.dataset.resend + '?resend=1', 'POST').then(load).catch(function (er) { s.textContent = er.message; }); }
  });
  $('q').addEventListener('input', render);
  $('csv').addEventListener('click', function () {
    var cols = COLS[T], rows = list();
    var csv = [cols.map(function (c) { return c[1]; }).join(',')].concat(rows.map(function (r) { return cols.map(function (c) { return '"' + String(fmt(c[0], r[c[0]]) == null ? '' : fmt(c[0], r[c[0]])).replace(/"/g, '""') + '"'; }).join(','); })).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'finmark-' + T + '-submissions-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
  });
  load();
})();
</script>
</body>
</html>
