# Netlify build settings for the FinMark Trust website.
# Every save in the content manager is a commit to GitHub; Netlify then rebuilds the Knowledge Hub feed and publishes the site.
[build]
  command = "node scripts/build-knowledge.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# The content manager must never be cached, so editors always get the latest configuration.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
